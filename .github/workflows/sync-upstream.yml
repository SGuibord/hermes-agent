name: Sync homelab branch from upstream

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Tag upstream (ex: v2026.6.5). Vide = latest.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homelab
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/NousResearch/hermes-agent.git

      - name: Fetch upstream tags
        run: git fetch upstream --tags

      - name: Determine target tag
        id: tag
        run: |
          if [ -n "${{ inputs.upstream_tag }}" ]; then
            echo "tag=${{ inputs.upstream_tag }}" >> $GITHUB_OUTPUT
          else
            TAG=$(git tag -l --sort=-version:refname | head -1)
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream tag into homelab
        run: |
          git merge "refs/tags/${{ steps.tag.outputs.tag }}" -X ours --no-edit --allow-unrelated-histories
          # Remove workflow files that upstream added (GITHUB_TOKEN lacks workflows scope)
          # -X ours only handles conflicts; new upstream files are added without conflict
          NEW_WF=$(git diff --name-only --diff-filter=A HEAD~1..HEAD -- .github/workflows/ 2>/dev/null || true)
          if [ -n "$NEW_WF" ]; then
            echo "Removing upstream-only workflow files: $NEW_WF"
            echo "$NEW_WF" | xargs git rm -f
            git commit -m "chore: remove upstream workflow files from homelab branch"
          fi

      - name: Push to homelab
        run: git push origin homelab