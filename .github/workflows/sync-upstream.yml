name: Sync homelab branch from upstream

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Tag upstream (ex: v2026.6.5). Vide = latest.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homelab
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/NousResearch/hermes-agent.git

      - name: Fetch upstream tags
        run: git fetch upstream --tags

      - name: Determine target tag
        id: tag
        run: |
          if [ -n "${{ inputs.upstream_tag }}" ]; then
            echo "tag=${{ inputs.upstream_tag }}" >> $GITHUB_OUTPUT
          else
            TAG=$(git tag -l --sort=-version:refname | head -1)
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream tag
        run: git merge "refs/tags/${{ steps.tag.outputs.tag }}" -X ours --no-edit --allow-unrelated-histories

      - name: Push to homelab
        run: git push origin homelab