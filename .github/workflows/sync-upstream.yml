name: Sync homelab branch from upstream

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Tag upstream (ex: v2026.6.5). Vide = latest.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homelab
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/NousResearch/hermes-agent.git

      - name: Fetch upstream tags
        run: git fetch upstream --tags

      - name: Determine target tag
        id: tag
        run: |
          if [ -n "${{ inputs.upstream_tag }}" ]; then
            echo "tag=${{ inputs.upstream_tag }}" >> $GITHUB_OUTPUT
          else
            TAG=$(git tag -l --sort=-version:refname | head -1)
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream tag into homelab
        run: |
          BEFORE=$(git rev-parse HEAD)
          git merge "refs/tags/${{ steps.tag.outputs.tag }}" -X ours --no-edit --allow-unrelated-histories
          # Restore our .github/workflows/ to avoid pushing upstream workflow files
          # (new upstream workflow files added by merge are not conflicts so -X ours doesn't block them)
          git checkout "$BEFORE" -- .github/workflows/ 2>/dev/null || true
          git diff --cached --quiet .github/workflows/ || \
            git commit -m "chore: restore homelab workflow files after upstream merge"

      - name: Push to homelab
        run: git push origin homelab