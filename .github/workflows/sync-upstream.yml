name: Sync upstream NousResearch/hermes-agent

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/NousResearch/hermes-agent.git

      - name: Fetch upstream main and tags
        run: git fetch upstream main --tags

      - name: Check if main is behind upstream
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "behind=false" >> $GITHUB_OUTPUT
            echo "Main is already up to date with upstream."
          else
            echo "behind=true" >> $GITHUB_OUTPUT
            echo "Upstream is ahead — will sync main, push tags, then merge homelab."
          fi

      - name: Reset main to upstream and push tags
        if: steps.check.outputs.behind == 'true'
        run: |
          git reset --hard upstream/main
          git push origin main --force-with-lease
          git push origin --tags --force
          echo "Tags pushed: $(git tag | tail -3 | tr '\n' ', ')"

      - name: Fetch homelab branch
        if: steps.check.outputs.behind == 'true'
        run: git fetch origin homelab

      - name: Merge updated main into homelab (-X ours keeps our patches on conflicts)
        if: steps.check.outputs.behind == 'true'
        run: |
          git checkout -b homelab origin/homelab
          git merge origin/main --no-ff -X ours -m "chore(sync): merge upstream NousResearch/main into homelab"
          git push origin homelab --force-with-lease

      # -X ours: on conflict, our homelab patches take precedence over upstream changes.
      # Tags are pushed so homelab-os check-hermes-upstream.yml can compare correctly.